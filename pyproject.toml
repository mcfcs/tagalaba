[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagalaba"
version = "0.1.0"
description = "Natural-sounding Tagalog crossword clue generator"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tagalaba = "tagalaba.cli:main"
tagalaba-synth = "tagalaba.synthesize:main"

[tool.setuptools.packages.find]
where = ["src"]
